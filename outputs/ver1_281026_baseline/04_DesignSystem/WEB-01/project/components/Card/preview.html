<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:var(--page-bg);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.note{font-size:12px;line-height:20px;color:var(--text-low)}
</style></head>
<body>
<div id="root" class="kka-root"></div>
<script>
var D = window.KidoKidoAdmin, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h(D.Card,{title:'各店舗平均滞在時間',style:{maxWidth:760}},
 h('div',{className:'row'}, h(D.TextField,{label:'開始期間',pill:true,placeholder:'yyyy/mm/dd'}), h(D.TextField,{label:'終了期間',pill:true,placeholder:'yyyy/mm/dd'})),
 h('p',{style:{textAlign:'center',margin:'24px 0 0'}},'日付を選択してください'))
);
</script>
</body>
</html>
