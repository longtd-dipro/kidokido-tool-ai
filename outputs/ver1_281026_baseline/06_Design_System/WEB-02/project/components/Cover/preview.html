<!doctype html>

<head><meta charset="utf-8"><style>
html,body{margin:0;height:100%}
.cv{position:relative;width:960px;height:300px;background:var(--page-bg);overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.p{fill:var(--primary)}
.s{fill:var(--surface-subtle)}
.y{fill:var(--accent-yellow)}
.c{fill:var(--surface-cream)}
.d{fill:var(--text-low)}
.rl{rx:var(--radius-lg);ry:var(--radius-lg)}
.rf{rx:var(--radius-field);ry:var(--radius-field)}
.txt{position:absolute;left:40px;bottom:32px;max-width:420px}
.name{margin:0;font-size:44px;line-height:1.15;font-weight:700;color:var(--text-high)}
.tag{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--text-middle)}
</style></head>
<body data-theme="light">
<div class="cv">
<!--
blocks: surface-subtle (dải nav 440×152) · primary (nút pill 280×64 + khối 160×120) · surface-cream (section 200×120) · accent-yellow (gạch chân 5px)
arrangement: toàn bộ bên phải x=480; dải surface-subtle trên cùng như header, khối primary dạng nút bo radius-field, gạch vàng dưới khối như usr-title-line
pattern: "dotted rule" → chấm r=2 pitch space-16, 6 hàng × 14 cột màu text-low — lấy từ kẻ chấm ngăn mục nav / khối form của site
scales: space-16 · space-24 · space-40 · radius-lg · radius-field
-->
