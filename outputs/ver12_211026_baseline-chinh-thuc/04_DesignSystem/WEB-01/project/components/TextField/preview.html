<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:var(--page-bg);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.note{font-size:12px;line-height:20px;color:var(--text-low)}
</style></head>
<body>
<div id="root" class="kka-root"></div>
<script>
var D = window.KidoKidoAdmin, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'grid2',style:{maxWidth:760}},
 h(D.TextField,{label:'開始期間',placeholder:'yyyy/mm/dd',endIcon:'clock'}),
 h(D.TextField,{label:'施設名',required:true,boldLabel:true,placeholder:'施設名'}),
 h(D.TextField,{label:'パスワード',required:true,boldLabel:true,helper:'※大文字、小文字、数字をそれぞれ1文字以上使用してください。（半角記号英数字8文字以上）',placeholder:'*********',endIcon:'visibility'}),
 h(D.TextField,{label:'氏名',value:'山田太郎'}),
 h(D.TextField,{label:'開始期間',pill:true,placeholder:'yyyy/mm/dd'}))
);
</script>
</body>
</html>
