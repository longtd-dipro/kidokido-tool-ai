<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><style>
html,body{margin:0;height:100%}
.cv{position:relative;width:960px;height:300px;background:var(--page-bg);overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.p{fill:var(--primary)}
.pg{fill:var(--primary-gradient-top)}
.ps{fill:var(--primary-subtle)}
.bb{fill:var(--brand-blue)}
.by{fill:var(--brand-yellow)}
.s{fill:var(--surface)}
.ss{fill:var(--surface-subtle)}
.dl{fill:var(--divider-low)}
.r10{rx:var(--radius-lg);ry:var(--radius-lg)}
.r8{rx:var(--radius-md);ry:var(--radius-md)}
.r4{rx:var(--radius-sm);ry:var(--radius-sm)}
.txt{position:absolute;left:40px;bottom:32px;max-width:420px}
.name{margin:0;font-size:56px;line-height:1.05;font-weight:700;color:var(--text-high)}
.tag{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--text-middle)}
</style></head>
<body>
<div class="cv">
<!--
blocks: brand-blue 120×120 + brand-yellow 40×40 (logo) · primary 200×56 (nút chính) · primary-gradient-top 200×8 · primary-subtle 32×32 (trang đang chọn) · surface card 360×200 với surface-subtle header
arrangement: toàn bộ bên phải x=480 — card bảng ở giữa phải, khối logo trên phải, nút chính chồng góc dưới card
pattern: "rows" → hàng bảng DataGrid, mỗi hàng cao 26 (= table-row-height 52 ÷ 2), kẻ divider-low, pitch theo space-24 / space-25 — admin là hệ thống danh sách + bảng
scales: space-16 · space-24 · space-32 · radius-lg (card, nút) · radius-md · radius-sm (ô trang)
-->
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <rect class="s r10" x="520" y="56" width="360" height="200"/>
  <rect class="ss" x="520" y="56" width="360" height="27"/>
  <rect class="dl" x="520" y="109" width="360" height="1"/>
  <rect class="dl" x="520" y="135" width="360" height="1"/>
  <rect class="dl" x="520" y="161" width="360" height="1"/>
  <rect class="dl" x="520" y="187" width="360" height="1"/>
  <rect class="dl" x="520" y="213" width="360" height="1"/>
  <rect class="ps r4" x="824" y="222" width="24" height="24"/>
  <rect class="bb r8" x="800" y="16" width="120" height="120"/>
  <rect class="by r8" x="840" y="56" width="40" height="40"/>
  <rect class="pg r10" x="560" y="232" width="200" height="56"/>
  <rect class="p r10" x="560" y="240" width="200" height="48"/>
</svg>
<div class="txt">
  <h1 class="name">KidoKido 管理画面</h1>
  <p class="tag">ボーネルンドあそび場予約・購入サイト — 管理画面</p>
</div>
</div>
</body>
</html>
