version: '3.8'
services:
  nextjs-app:
    container_name: nextjs-app
    image: tokiwagi:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - NODE_ENV=production
      # Enable BuildKit for faster builds with caching
      cache_from:
        - tokiwagi:${TAG:-latest}
    env_file: ../.env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - "/data/logs:/app/logs"
      - "/data/public/uploads:/app/public/uploads"
    restart: always
